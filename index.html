<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NLB OKR-Schnellcheck</title>
  <meta name="description" content="Optokinetischer Reflex: Streifenband mit Augen-Tracking über die Frontkamera">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="OKR">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="alternate" hreflang="en" href="EN/">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="btn ghost" hidden>‹ Übersicht</button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span>OKR-Schnellcheck</div>
    <div class="topbar-meta" id="topmeta"></div>
    <a class="lang-switch" href="EN/" hreflang="en" lang="en">English</a>
  </header>

  <main id="main"></main>

  <!-- Vollbild-Ebene für Kalibrierung und Messung -->
  <div id="fs" hidden>
    <canvas id="stage"></canvas>
    <div id="hud" hidden></div>
    <div id="overlay" hidden></div>
  </div>

  <video id="cam" playsinline muted autoplay class="cam-off"></video>
  <div id="rotate" hidden><div>Bitte das Gerät ins Querformat drehen.</div></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
