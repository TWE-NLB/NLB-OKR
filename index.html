<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Eye Reflex Lab</title>
  <meta name="description" content="The optokinetic reflex experiment – see how your eyes follow a moving pattern. Wellness and teaching app, not a medical device.">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Eye Reflex Lab">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Hebrew:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="css/app.css?v=2.4.1">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
  <header class="topbar">
    <button id="back" class="btn ghost" hidden></button>
    <div class="brand"><span class="brand-mark" aria-hidden="true"></span><span id="brand-name">Eye Reflex Lab</span></div>
    <div class="topbar-meta" id="topmeta"></div>
    <select id="lang-select" class="lang-select" hidden></select>
  </header>

  <main id="main"></main>

  <!-- Vollbild-Ebene für Kalibrierung und Messung -->
  <div id="fs" hidden>
    <canvas id="stage"></canvas>
    <div id="hud" hidden></div>
    <div id="overlay" hidden></div>
  </div>

  <video id="cam" playsinline muted autoplay class="cam-off"></video>
  <div id="rotate" hidden><div></div></div>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="js/app.js?v=2.4.1"></script>
  <script>
    // Falls das Programm nicht startet (z. B. alte Dateien im Browser-Cache), Hinweis statt leerer Seite
    setTimeout(function () {
      var m = document.getElementById('main');
      if (!m || m.children.length) return;
      var de = /^de/i.test(navigator.language);
      m.innerHTML = '<div class="panel notice">' + (de
        ? 'Die App konnte nicht geladen werden. Bitte die Seite neu laden. Hilft das nicht: Browserverlauf und Website-Daten für diese Seite löschen.'
        : 'The app could not be loaded. Please reload the page. If that does not help, clear the browser history and website data for this page.') + '</div>';
    }, 6000);
  </script>
</body>
</html>
